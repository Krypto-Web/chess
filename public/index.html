<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Chess — Starter</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <h1>Chess (Starter)</h1>
  </header>

  <main>
    <section id="controls">
      <button id="createBtn">Create Room</button>
      <input id="roomInput" placeholder="room id" />
      <button id="joinBtn">Join Room</button>
      <button id="localBtn">Local 2‑player (no network)</button>
      <span id="roomLabel"></span>
    </section>

    <section id="boardArea">
      <div id="status">Not connected</div>
      <div id="board" class="board"></div>
    </section>

    <section id="actions">
      <button id="newGameBtn">New Game</button>
      <button id="resignBtn">Resign</button>
      <div id="gameInfo"></div>
    </section>
  </main>

  <footer>
    <small>Starter chess website. Server-authoritative moves via Socket.IO.</small>
  </footer>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/1.0.0/chess.min.js"></script>
  <script src="/client.js"></script>
</body>
</html>
